<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Градиентный фон -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="30" fill="url(#grad)"/>
  
  <!-- Книжные страницы -->
  <rect x="40" y="40" width="120" height="130" rx="8" fill="white" opacity="0.9"/>
  <rect x="40" y="40" width="120" height="130" rx="8" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  
  <!-- Линии страниц -->
  <line x1="60" y1="70" x2="140" y2="70" stroke="#bdc3c7" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="90" x2="140" y2="90" stroke="#bdc3c7" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="110" x2="140" y2="110" stroke="#bdc3c7" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="130" x2="140" y2="130" stroke="#bdc3c7" stroke-width="2" opacity="0.5"/>
  
  <!-- B -->
  <text x="100" y="160" font-family="Georgia, serif" font-size="48" font-weight="bold" 
        fill="#2c3e50" text-anchor="middle">B</text>
  
  <!-- Акцент -->
  <circle cx="165" cy="45" r="10" fill="#e67e22"/>
</svg>