    <div class="user-grid">
      <div class="user-card" *ngFor="let user of users">
        <h3>{{ user.family_name }} {{ user.name }} {{ user.middle_name || '' }}</h3>
        <p>ID: {{ user.id }}</p>
        <p>Дата регистрации: {{ user.reg_date | date:'dd.MM.yyyy' }}</p>
      </div>
    </div>
