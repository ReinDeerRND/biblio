<!-- src/app/register/register.component.html -->
<div class="register-container">
    <div class="register-card">
        <h2>Авторизация читателя</h2>

        <!-- Сообщение об успехе -->
        <div *ngIf="registrationSuccess" class="alert alert-success">
            <strong>Успешно!</strong> Регистрация завершена. Перенаправление на страницу входа...
        </div>

        <form nz-form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!registrationSuccess">
            <nz-form-item>
                <nz-form-label [nzSpan]="6">Номер читателя</nz-form-label>
                <nz-form-control [nzSpan]="18" >
                    <input nz-input formControlName="id" placeholder="Введите свой номер" />
                </nz-form-control>
            </nz-form-item>
            <nz-form-item>
                <nz-form-label [nzSpan]="6" >Email</nz-form-label>
                <nz-form-control [nzSpan]="18" [nzErrorTip]="emailErrorTip">
                    <input nz-input formControlName="email" placeholder="example@mail.com" />
                    <ng-template #emailErrorTip let-control>
                        <ng-container *ngIf="control.hasError('required')">
                            Пожалуйста, введите email
                        </ng-container>
                        <ng-container *ngIf="control.hasError('email')">
                            Введите корректный email адрес
                        </ng-container>
                    </ng-template>
                </nz-form-control>
            </nz-form-item>

            <nz-form-item>
                <nz-form-label [nzSpan]="6" nzRequired>Пароль</nz-form-label>
                <nz-form-control [nzSpan]="18" [nzErrorTip]="passErrorTip">
                    <input nz-input formControlName="password" placeholder="Минимум 6 символов" />
                    <ng-template #passErrorTip let-control>
                        <ng-container *ngIf="control.hasError('required')">
                            Пожалуйста, введите пароль
                        </ng-container>
                        <ng-container *ngIf="control.hasError('minlength')">
                            Пароль должно содержать минимум 6 символа
                        </ng-container>
                    </ng-template>
                </nz-form-control>
            </nz-form-item>
        

            <div class="form-actions">
                <button nz-button nzType="primary" (click)="onSubmit()">Зарегистрироваться</button>
                <button nz-button nzType="default" (click)="onReset()">Очистить форму</button>
            </div>

            <div class="login-link">
                Уже есть аккаунт? <a routerLink="/login">Войти</a>
            </div>
        </form>
    </div>
</div>
